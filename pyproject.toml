[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polemix"
version = "1.0.0"
description = "Structured multi-persona AI debates on your own machine — works with LM Studio, Ollama and any OpenAI-compatible local server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Valentina Kiyungi" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "debate", "multi-agent", "lm-studio", "ollama", "local-ai", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/valentinakiyungi/polemix"
Issues = "https://github.com/valentinakiyungi/polemix/issues"

[project.scripts]
polemix = "polemix.cli:main"

[tool.setuptools]
packages = ["polemix"]

[tool.setuptools.package-data]
polemix = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
